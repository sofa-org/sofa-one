name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run verify:backend

  backend-billing-e2e:
    name: Backend isolated PostgreSQL security and billing E2E
    runs-on: ubuntu-latest

    # Job-local maintenance DB only. The existing runner provisions and verifies
    # a fresh DB + role for EACH suite, migrates it, and drops it in finally.
    # Default coverage includes session/MFA, wallet provisioning/execution,
    # DeFi authorization, signing budgets and billing concurrency boundaries.
    # No static shared test DATABASE_URL is accepted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Admin provisioning URL only (maintenance DB). The runner never forwards
      # this to child Jest; suites receive a generated target URL + metadata.
      BILLING_E2E_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # Readiness against the admin/maintenance URL only. Identity mismatch
      # (wrong current_database) fails immediately rather than retrying.
      - name: Wait for PostgreSQL admin readiness
        run: |
          node -e '
            const { Client } = require("pg");
            const deadline = Date.now() + 60000;
            const url = process.env.BILLING_E2E_ADMIN_DATABASE_URL;
            (async () => {
              while (Date.now() < deadline) {
                const client = new Client({ connectionString: url });
                try {
                  await client.connect();
                  const { rows } = await client.query(
                    "SELECT current_database() AS name, current_user::text AS usr"
                  );
                  if (rows[0]?.name !== "postgres") {
                    throw Object.assign(
                      new Error("admin identity mismatch: expected maintenance database postgres"),
                      { fatal: true }
                    );
                  }
                  if (!rows[0]?.usr) {
                    throw Object.assign(new Error("admin identity mismatch: empty current_user"), {
                      fatal: true,
                    });
                  }
                  await client.end();
                  console.log("PostgreSQL admin ready (maintenance db postgres)");
                  return;
                } catch (err) {
                  await client.end().catch(() => {});
                  if (err && err.fatal) {
                    console.error(err.message);
                    process.exit(1);
                  }
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
              }
              throw new Error("PostgreSQL admin did not become ready within 60 seconds");
            })().catch((error) => { console.error(error.message); process.exit(1); });
          '

      # Includes all runner PG suites; each file gets an independently migrated
      # target so destructive cleanup/canonical seeds cannot affect its peers.
      - name: Run isolated PostgreSQL security and billing E2E
        run: npm run test:e2e:billing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:3100
      VITE_OPENFORT_PUBLISHABLE_KEY: ci_openfort_publishable_key
      VITE_OPENFORT_SHIELD_PUBLISHABLE_KEY: ci_openfort_shield_publishable_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify
